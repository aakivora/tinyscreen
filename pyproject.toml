[project]
name = "tiny-screen"
version = "0.1.0"
description = "Smart display for a Raspberry Pi + RGB LED matrix: scrolling weather/art sentence, Spotify now-playing"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0.0,<12.0.0",
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

# RGBMatrixEmulator is only needed for local development against the software
# emulator (Mac). Real hardware uses the `rgbmatrix` library instead, built
# from source directly on the Pi (see tinyscreen/display.py) - not a pip
# package at all, so it's not listed here either way. Keeping
# RGBMatrixEmulator out of the base dependency set means `uv sync` on
# constrained/uncommon-architecture hardware (e.g. the original Pi Zero's
# ARMv6 chip) never has to build RGBMatrixEmulator's numpy dependency from
# source, which is slow-to-impossible on that hardware and is never actually
# needed there.
[project.optional-dependencies]
emulator = [
    "RGBMatrixEmulator>=0.19.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Without this, pytest also tries to collect experiments/test_*.py - one-off
# manual scripts (named to be run directly, not test suites) that pull in
# dependencies like opencv-python deliberately kept out of the real project
# dependencies (see experiments/test_video_on_matrix.py's own docstring).
testpaths = ["tests"]

# Without this, setuptools' automatic package discovery sees both assets/
# (fonts/art, not Python code) and tinyscreen/ at the top level and refuses
# to guess which one is "the package" - surfaces as a `pip install -e .`
# failure ("Multiple top-level packages discovered in a flat-layout").
# uv sync tolerates the ambiguity, but plain pip (needed on real hardware,
# see tinyscreen/display.py, since rgbmatrix's build installs into its own
# venv outside uv's management) enforces it strictly.
[tool.setuptools.packages.find]
include = ["tinyscreen*"]
